
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gidi's Number Game</title>
<style>
body {
  margin: 0;
  padding: 25px 15px;
  background: #14251f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
.game {
  max-width: 400px;
  margin: 25px auto;
  padding: 25px 18px;
  background: #20372f;
  border-radius: 20px;
}
h1 { color: #e5c57f; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
  font-size: 18px;
}
input {
  background: #fff;
  border: 0;
  text-align: center;
}
button {
  background: #e5c57f;
  border: 0;
  font-weight: bold;
}
#message { min-height: 45px; margin-top: 20px; }
</style>
</head>
<body>
<div class="game">
  <p>GIDI HERITAGE PRESENTS</p>
  <h1>Gidi's Number Game</h1>
  <p>Guess my secret number from 1 to 10!</p>
  <form id="gameForm">
    <input id="guess" type="number" min="1" max="10"
      step="1" placeholder="Enter 1–10" required>
    <button type="submit">Check My Guess</button>
  </form>
  <p id="message">Let's play, champ!</p>
  <p>Guesses: <span id="count">0</span></p>
  <button type="button" id="again">Play Again</button>
</div>
<script>
let secret = Math.floor(Math.random() * 10) + 1;
let guesses = 0;
let finished = false;

document.getElementById("gameForm").onsubmit = function(event) {
  event.preventDefault();
  if (finished) return;

  let guess = Number(document.getElementById("guess").value);
  let message = document.getElementById("message");

  if (!Number.isInteger(guess) || guess < 1 || guess > 10) {
    message.textContent = "Enter a whole number from 1 to 10.";
    return;
  }

  guesses++;
  document.getElementById("count").textContent = guesses;

  if (guess === secret) {
    message.textContent = "Correct! You win!";
    finished = true;
  } else if (guess < secret) {
    message.textContent = "Too low! Try higher.";
  } else {
    message.textContent = "Too high! Try lower.";
  }

  document.getElementById("guess").value = "";
};

document.getElementById("again").onclick = function() {
  secret = Math.floor(Math.random() * 10) + 1;
  guesses = 0;
  finished = false;
  document.getElementById("count").textContent = "0";
  document.getElementById("message").textContent = "New number chosen. Let's play!";
  document.getElementById("guess").value = "";
};
</script>
</body>
</html>
